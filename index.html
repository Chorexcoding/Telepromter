<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#111;--mut:#666;--ac:#2563eb;--bd:#d8d8de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1f;--tx:#f2f2f2;--mut:#9a9aa3;--ac:#4f8cff;--bd:#333}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1f;--tx:#f2f2f2;--mut:#9a9aa3;--ac:#4f8cff;--bd:#333}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#setup{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:4px 0}
textarea{width:100%;height:200px;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);resize:vertical}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
label{font-size:14px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
input[type=range]{width:100%}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#start{padding:14px;font-size:18px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}
.note{font-size:12px;color:var(--mut);margin:0}
#reader{display:none;position:fixed;inset:0;background:#000;color:#fff;z-index:5;overflow:hidden}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#dim{position:absolute;inset:0;background:#000;opacity:.3;display:none;pointer-events:none}
#scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;white-space:pre-wrap;line-height:1.5;font-weight:700;text-align:center}
#scroll::-webkit-scrollbar{display:none}
#scroll.mirror{transform:scaleX(-1)}
#scroll.shadow{text-shadow:0 0 6px #000,0 0 3px #000,0 1px 2px #000}
#line{position:absolute;left:0;right:0;top:40%;height:2px;background:rgba(255,80,80,.55);pointer-events:none}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vmin;font-weight:800;background:rgba(0,0,0,.45);pointer-events:none}
#rec{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:#d00;border-radius:8px;padding:4px 10px;font-size:14px;display:none}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.65);transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
#bar button,#bar a{flex:1;min-width:70px;padding:12px;border:0;border-radius:10px;background:#2b2b30;color:#fff;font-size:15px;text-align:center;text-decoration:none}
#bar input{flex:2;min-width:120px}
#recbtn{display:none}
#dl{display:none;background:#16a34a!important}
</style>
</head>
<body>
<div id="setup">
  <h1>📜 Mera Teleprompter</h1>
  <textarea id="script" placeholder="Apni script yahan paste karo…"></textarea>

  <div class="card">
    <label>Speed <span id="spv"></span></label>
    <input type="range" id="speed" min="1" max="20" value="5">
    <label>Font size <span id="fsv"></span></label>
    <input type="range" id="fsize" min="24" max="96" value="48">
    <label>Text width (lens ke paas patla rakho) <span id="twv"></span></label>
    <input type="range" id="twidth" min="40" max="100" value="80">
    <label><span>Mirror mode (sheeshe ke liye)</span><input type="checkbox" id="mirror"></label>
  </div>

  <div class="card">
    <label>Background</label>
    <div class="seg" id="bgs">
      <button data-b="black" class="on">Black</button>
      <button data-b="camera">Transparent (Camera)</button>
      <button data-b="green">Green</button>
    </div>
    <div id="camopts">
      <label>Camera</label>
      <div class="seg" id="facing">
        <button data-f="user" class="on">Front</button>
        <button data-f="environment">Back</button>
      </div>
      <label style="margin-top:10px">Andhera (readability) <span id="dmv"></span></label>
      <input type="range" id="dimv" min="0" max="80" value="30">
    </div>
    <p class="note">Transparent = camera live peeche dikhega, script uske upar. Video 16:9 (1920×1080) me record hogi, isliye Horizontal lock use karo.</p>
  </div>

  <div class="card">
    <label>Screen Lock</label>
    <div class="seg" id="orient">
      <button data-o="auto">Auto</button>
      <button data-o="portrait">Vertical 📱</button>
      <button data-o="landscape" class="on">Horizontal 🔒</button>
    </div>
    <p class="note" id="onote">Lock Start dabane par lagega (fullscreen me). Android Chrome par chalta hai; iPhone par browser lock support nahi karta.</p>
  </div>

  <button id="start">▶ Start</button>
</div>

<div id="reader">
  <video id="cam" autoplay muted playsinline></video>
  <div id="dim"></div>
  <div id="scroll"></div>
  <div id="line"></div>
  <div id="cd"></div>
  <div id="rec">● REC</div>
  <div id="bar">
    <button id="back">✕ Band</button>
    <button id="play">⏸ Pause</button>
    <button id="recbtn">⏺ Rec</button>
    <input type="range" id="speed2" min="1" max="20">
    <a id="dl">⬇ Video save karo</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let orient='landscape', bg='black', facing='user';
let playing=false, pos=0, last=0, raf=0, hideT=0;
let stream=null, recorder=null, chunks=[], wake=null;

function seg(id, key, set){
  document.querySelectorAll('#'+id+' button').forEach(b => b.onclick = () => { set(b.dataset[key]); save(); });
}
function mark(id, key, v){
  document.querySelectorAll('#'+id+' button').forEach(b => b.classList.toggle('on', b.dataset[key]===v));
}
function setOrient(v){ orient=v; mark('orient','o',v); }
function setBg(v){ bg=v; mark('bgs','b',v); $('camopts').style.display = v==='camera' ? 'block':'none'; }
function setFacing(v){ facing=v; mark('facing','f',v); }
seg('orient','o',setOrient); seg('bgs','b',setBg); seg('facing','f',setFacing);

function labels(){
  $('spv').textContent=$('speed').value;
  $('fsv').textContent=$('fsize').value+' px';
  $('twv').textContent=$('twidth').value+'%';
  $('dmv').textContent=$('dimv').value+'%';
}
function save(){
  try{ localStorage.setItem('tp2', JSON.stringify({
    script:$('script').value, speed:$('speed').value, fsize:$('fsize').value, twidth:$('twidth').value,
    dimv:$('dimv').value, mirror:$('mirror').checked, orient, bg, facing })); }catch(e){}
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem('tp2')||'{}');
    if(s.script) $('script').value=s.script;
    ['speed','fsize','twidth','dimv'].forEach(k => { if(s[k]) $(k).value=s[k]; });
    if(s.mirror) $('mirror').checked=true;
    if(s.orient) setOrient(s.orient);
    if(s.bg) setBg(s.bg);
    if(s.facing) setFacing(s.facing);
  }catch(e){}
  setBg(bg); labels();
}
['script','speed','fsize','twidth','dimv','mirror'].forEach(i => $(i).addEventListener('input', () => { labels(); save(); }));

const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const SO = () => window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.ScreenOrientation;
async function saveNative(blob,name){
  const P=Capacitor.Plugins;
  const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob);});
  const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
  await P.Share.share({title:'Video',url:w.uri});
}
async function lockScreen(){
  if(NATIVE && SO()){ try{ if(orient==='auto') await SO().unlock(); else await SO().lock({orientation:orient}); }catch(e){} return; }
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    if(orient==='auto') screen.orientation.unlock && screen.orientation.unlock();
    else await screen.orientation.lock(orient);
  }catch(e){ $('onote').textContent='Is device par lock nahi lag paya. Phone ka rotation lock khud on kar lo.'; }
}
function unlockScreen(){
  if(NATIVE && SO()){ try{ SO().unlock(); }catch(e){} return; }
  try{ screen.orientation.unlock && screen.orientation.unlock(); }catch(e){}
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}
async function keepAwake(){ try{ wake = await navigator.wakeLock.request('screen'); }catch(e){} }

async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:facing, width:{ideal:1920}, height:{ideal:1080}, aspectRatio:{ideal:16/9} },
      audio:true });
    $('cam').srcObject = stream;
    $('cam').style.transform = facing==='user' ? 'scaleX(-1)' : 'none';
    $('cam').style.display = 'block';
    return true;
  }catch(e){
    $('onote').textContent='Camera allow nahi hua ya is page par nahi chal raha. Black background use ho raha hai.';
    return false;
  }
}
function stopCam(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream=null; }
  $('cam').srcObject=null; $('cam').style.display='none';
}

function countdown(n, cb){
  const c=$('cd'); c.style.display='flex';
  (function step(){
    if(n<=0){ c.style.display='none'; cb(); return; }
    c.textContent=n; n--; setTimeout(step,1000);
  })();
}
function startRec(){
  if(!stream) return;
  chunks=[];
  const types=['video/mp4','video/webm;codecs=vp9,opus','video/webm'];
  const mt=types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  try{ recorder = mt ? new MediaRecorder(stream,{mimeType:mt, videoBitsPerSecond:8000000}) : new MediaRecorder(stream); }
  catch(e){ $('onote').textContent='Is browser me recording support nahi hai.'; return; }
  recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const type=recorder.mimeType||'video/webm';
    const blob=new Blob(chunks,{type});
    const a=$('dl');
    a.href=URL.createObjectURL(blob);
    a.download='teleprompter-'+Date.now()+(type.includes('mp4')?'.mp4':'.webm');
    if(NATIVE){ a.onclick = ev => { ev.preventDefault(); saveNative(blob,a.download); }; }
    a.style.display='block'; $('rec').style.display='none'; $('recbtn').textContent='⏺ Rec'; showBar();
  };
  recorder.start(1000);
  $('rec').style.display='block'; $('recbtn').textContent='⏹ Stop';
}
function stopRec(){ if(recorder && recorder.state!=='inactive') recorder.stop(); }

function tick(t){
  if(!playing) return;
  const dt=(t-last)/1000; last=t;
  const sc=$('scroll');
  pos += parseFloat($('speed2').value)*12*dt;
  sc.scrollTop=pos;
  if(pos >= sc.scrollHeight-sc.clientHeight){ setPlay(false); return; }
  raf=requestAnimationFrame(tick);
}
function setPlay(p){
  playing=p; $('play').textContent = p ? '⏸ Pause':'▶ Play';
  if(p){ last=performance.now(); pos=$('scroll').scrollTop; raf=requestAnimationFrame(tick); }
  else cancelAnimationFrame(raf);
}
function showBar(){
  $('bar').classList.remove('hide'); clearTimeout(hideT);
  hideT=setTimeout(() => { if(playing) $('bar').classList.add('hide'); },3000);
}

$('start').onclick = async () => {
  const text=$('script').value.trim();
  if(!text){ $('script').focus(); return; }
  save();
  const sc=$('scroll'), tw=parseFloat($('twidth').value);
  sc.textContent=text;
  sc.style.fontSize=$('fsize').value+'px';
  sc.style.padding='40vh '+((100-tw)/2)+'% 60vh';
  sc.classList.toggle('mirror',$('mirror').checked);
  $('speed2').value=$('speed').value;
  $('reader').style.background = bg==='green' ? '#00b140' : '#000';
  $('reader').style.display='block';
  sc.scrollTop=0; pos=0;
  $('dl').style.display='none';
  await lockScreen(); keepAwake();
  let cam=false;
  if(bg==='camera') cam = await startCam();
  sc.classList.toggle('shadow',cam);
  $('dim').style.display = cam ? 'block':'none';
  $('dim').style.opacity = $('dimv').value/100;
  $('recbtn').style.display = cam ? 'block':'none';
  showBar();
  if(cam){ setPlay(false); }          // pehle khud ko frame karo, fir Rec dabao
  else countdown(3, () => { setPlay(true); showBar(); });
};
$('recbtn').onclick = e => {
  e.stopPropagation();
  if(recorder && recorder.state==='recording'){ stopRec(); setPlay(false); return; }
  countdown(3, () => { startRec(); setPlay(true); showBar(); });
};
$('back').onclick = () => {
  setPlay(false); stopRec();
  setTimeout(stopCam, 300);
  $('reader').style.display='none'; $('rec').style.display='none';
  try{ wake && wake.release(); }catch(e){}
  unlockScreen();
  $('speed').value=$('speed2').value; labels(); save();
};
$('play').onclick = e => { e.stopPropagation(); setPlay(!playing); showBar(); };
$('speed2').oninput=showBar;
$('scroll').addEventListener('click',showBar);
$('scroll').addEventListener('touchmove',() => { pos=$('scroll').scrollTop; });
$('scroll').addEventListener('wheel',() => { pos=$('scroll').scrollTop; });

load();
</script>
</body>
</html>
